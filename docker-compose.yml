services:
  research-agent:
    build:
      context: .
      dockerfile: research_agent/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=research-agent
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TASK_DB=/data/tasks.db
    volumes:
      - research-agent-data:/data
    networks:
      - a2a-network

  writing-agent:
    build:
      context: .
      dockerfile: writing_agent/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - HOST=writing-agent
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TASK_DB=/data/tasks.db
    volumes:
      - writing-agent-data:/data
    networks:
      - a2a-network

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AGENT_URLS=${AGENT_URLS:-http://research-agent:8001,http://writing-agent:8002}
      - RESEARCH_AGENT_URL=http://research-agent:8001
      - WRITING_AGENT_URL=http://writing-agent:8002
    depends_on:
      - research-agent
      - writing-agent
    networks:
      - a2a-network

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RESEARCH_AGENT_URL=http://research-agent:8001
      - WRITING_AGENT_URL=http://writing-agent:8002
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      - research-agent
      - writing-agent
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge

volumes:
  research-agent-data:
  writing-agent-data:
