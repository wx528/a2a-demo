x-dns: &default-dns
  dns:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8

services:
  research-agent:
    <<: *default-dns
    build:
      context: .
      dockerfile: research_agent/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=research-agent
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TASK_DB=/data/tasks.db
    volumes:
      - research-agent-data:/data
    networks:
      - a2a-network

  writing-agent:
    <<: *default-dns
    build:
      context: .
      dockerfile: writing_agent/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - HOST=writing-agent
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TASK_DB=/data/tasks.db
    volumes:
      - writing-agent-data:/data
    networks:
      - a2a-network

  debate-agent:
    <<: *default-dns
    build:
      context: .
      dockerfile: debate_agent/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - HOST=debate-agent
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-duckduckgo}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - TASK_DB=/data/tasks.db
    volumes:
      - debate-agent-data:/data
    networks:
      - a2a-network

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - AGENT_URLS=${AGENT_URLS:-http://research-agent:8001,http://writing-agent:8002,http://debate-agent:8003}
      - RESEARCH_AGENT_URL=http://research-agent:8001
      - WRITING_AGENT_URL=http://writing-agent:8002
    depends_on:
      - research-agent
      - writing-agent
      - debate-agent
    networks:
      - a2a-network

  web:
    <<: *default-dns
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - RESEARCH_AGENT_URL=http://research-agent:8001
      - WRITING_AGENT_URL=http://writing-agent:8002
      - DEBATE_AGENT_URL=http://debate-agent:8003
      - ROLE_AGENT_URLS=ada=http://role-ada:8011,turing=http://role-turing:8012,linus=http://role-linus:8013,sage=http://role-sage:8014
      - V2_DB=data/v2_tasks.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - web-data:/app/data
    depends_on:
      - research-agent
      - writing-agent
      - debate-agent
      - role-ada
      - role-turing
      - role-linus
      - role-sage
    networks:
      - a2a-network

  role-ada:
    <<: *default-dns
    build:
      context: .
      dockerfile: role_agent/Dockerfile
    ports:
      - "8011:8011"
    environment:
      - ROLE=ada
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - PORT=8011
      - AGENT_URL=http://role-ada:8011
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    networks:
      - a2a-network

  role-turing:
    <<: *default-dns
    build:
      context: .
      dockerfile: role_agent/Dockerfile
    ports:
      - "8012:8012"
    environment:
      - ROLE=turing
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - PORT=8012
      - AGENT_URL=http://role-turing:8012
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    networks:
      - a2a-network

  role-linus:
    <<: *default-dns
    build:
      context: .
      dockerfile: role_agent/Dockerfile
    ports:
      - "8013:8013"
    environment:
      - ROLE=linus
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - PORT=8013
      - AGENT_URL=http://role-linus:8013
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    networks:
      - a2a-network

  role-sage:
    <<: *default-dns
    build:
      context: .
      dockerfile: role_agent/Dockerfile
    ports:
      - "8014:8014"
    environment:
      - ROLE=sage
      - BIND_HOST=0.0.0.0
      - A2A_API_KEY=${A2A_API_KEY:-}
      - PORT=8014
      - AGENT_URL=http://role-sage:8014
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge

volumes:
  research-agent-data:
  writing-agent-data:
  debate-agent-data:
  web-data:
