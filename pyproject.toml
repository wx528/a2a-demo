[project]
name = "a2a-agent-swarm"
version = "0.1.0"
description = "A2A Agent Swarm Example with UV package management"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "openai==1.54.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 入口文件使用 sys.path 引导 + load_env() 模式，import 位置天然不在文件顶部
ignore = ["E402"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
