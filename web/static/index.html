<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2A 多人会议室</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // 强制使用 classic JSX runtime，避免 Babel 注入 react/jsx-runtime import
        Babel.registerPreset("react-classic", {
            presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .thinking-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .markdown-body h1 { font-size: 1.5rem; font-weight: bold; margin: 1rem 0 0.5rem; }
        .markdown-body h2 { font-size: 1.25rem; font-weight: bold; margin: 0.875rem 0 0.5rem; }
        .markdown-body p { margin: 0.5rem 0; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
        .markdown-body code { background: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; }
        .markdown-body pre {
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef } = React;

        // 配置 Markdown 解析：启用 GitHub Flavored Markdown 和自动换行
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: false,
                mangle: false,
            });
        }

        function App() {
            const [meetings, setMeetings] = useState([]);
            const [view, setView] = useState('list');
            const [meeting, setMeeting] = useState(null);
            const [topic, setTopic] = useState("");
            const [mode, setMode] = useState("pipeline");
            const [maxRounds, setMaxRounds] = useState(1);
            const [input, setInput] = useState("");
            const [connected, setConnected] = useState(false);
            const [personas, setPersonas] = useState([]);
            const [proPersona, setProPersona] = useState("socrates");
            const [conPersona, setConPersona] = useState("hume");
            const [autoPlay, setAutoPlay] = useState(false);
            const [turnInfo, setTurnInfo] = useState(null);   // {done, next}
            const [turnRunning, setTurnRunning] = useState(false);
            const autoPlayRef = useRef(false);
            autoPlayRef.current = autoPlay;
            const messagesEndRef = useRef(null);

            const updateUrl = (meetingId) => {
                const url = new URL(window.location.href);
                if (meetingId) {
                    url.searchParams.set('meeting', meetingId);
                } else {
                    url.searchParams.delete('meeting');
                }
                window.history.replaceState({}, '', url);
            };

            const loadMeetings = async () => {
                try {
                    const res = await fetch('/api/meetings');
                    if (!res.ok) return;
                    const data = await res.json();
                    setMeetings(data);
                } catch (e) {
                    console.error('load meetings failed', e);
                }
            };

            const deleteMeeting = async (e, id) => {
                e.stopPropagation();
                if (!confirm('确定删除这个会议室吗？')) return;
                try {
                    await fetch(`/api/meetings/${id}`, { method: 'DELETE' });
                    setMeetings(prev => prev.filter(m => m.id !== id));
                    if (meeting?.id === id) {
                        setMeeting(null);
                        setView('list');
                        updateUrl(null);
                    }
                } catch (err) {
                    console.error('delete meeting failed', err);
                }
            };

            const openMeeting = async (meetingId) => {
                const res = await fetch(`/api/meetings/${meetingId}`);
                if (!res.ok) return;
                const data = await res.json();
                setMeeting(data);
                setView('room');
                updateUrl(meetingId);
                connectSSE(meetingId);
            };

            const createMeeting = async () => {
                if (!topic.trim()) return;
                const res = await fetch("/api/meetings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        topic, mode, max_rounds: maxRounds,
                        auto_play: autoPlay,
                        pro_persona: proPersona, con_persona: conPersona,
                    }),
                });
                const data = await res.json();
                setMeeting(data);
                setView('room');
                updateUrl(data.id);
                setMeetings(prev => [data, ...prev]);
                connectSSE(data.id);
            };

            const refreshTurn = async (meetingId) => {
                try {
                    const res = await fetch(`/api/meetings/${meetingId}/next-turn`);
                    if (!res.ok) return;
                    setTurnInfo(await res.json());
                } catch (e) { /* 忽略 */ }
            };

            const connectSSE = (meetingId) => {
                const evtSource = new EventSource(`/api/meetings/${meetingId}/events`);

                evtSource.addEventListener("init", (e) => {
                    setMeeting(JSON.parse(e.data));
                    setConnected(true);
                    refreshTurn(meetingId);
                });

                evtSource.onerror = () => {
                    setConnected(false);
                    evtSource.close();
                };
            };

            const applyTurnEvent = (ev, data, meetingId) => {
                if (ev === "message" || ev === "system") {
                    const msg = ev === "system"
                        ? {
                            id: Date.now().toString(), meeting_id: meetingId,
                            participant_id: "system", participant_name: "系统",
                            role: "system", content: JSON.parse(data).content,
                            timestamp: new Date().toLocaleTimeString(), type: "system",
                        }
                        : JSON.parse(data);
                    setMeeting(prev => ({ ...prev, messages: [...prev.messages, msg] }));
                } else if (ev === "status") {
                    const { participant_id, status } = JSON.parse(data);
                    setMeeting(prev => ({
                        ...prev,
                        participants: prev.participants.map(p =>
                            p.id === participant_id ? { ...p, status } : p),
                    }));
                }
            };

            const runNextTurn = async (meetingId) => {
                if (turnRunning) return;
                setTurnRunning(true);
                try {
                    const res = await fetch(`/api/meetings/${meetingId}/turns/next`, { method: "POST" });
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buf = "";
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buf += decoder.decode(value, { stream: true });
                        let idx;
                        while ((idx = buf.indexOf("\n\n")) >= 0) {
                            const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
                            let ev = null, data = null;
                            for (const line of block.split("\n")) {
                                if (line.startsWith("event: ")) ev = line.slice(7);
                                else if (line.startsWith("data: ")) data = line.slice(6);
                            }
                            if (ev === "turn_done") {
                                const payload = JSON.parse(data);
                                setTurnInfo(payload);
                                if (!payload.done && autoPlayRef.current) {
                                    setTimeout(() => runNextTurn(meetingId), 600);
                                }
                            } else {
                                applyTurnEvent(ev, data, meetingId);
                            }
                        }
                    }
                } finally {
                    setTurnRunning(false);
                }
            };

            const sendMessage = async () => {
                if (!input.trim() || !meeting) return;

                await fetch(`/api/meetings/${meeting.id}/messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: input }),
                });

                setMeeting(prev => ({
                    ...prev,
                    messages: [...prev.messages, {
                        id: Date.now().toString(),
                        meeting_id: prev.id,
                        participant_id: "user",
                        participant_name: "你",
                        role: "user",
                        content: input,
                        timestamp: new Date().toLocaleTimeString(),
                        type: "message",
                    }],
                }));

                setInput("");

                // 步进模式：插入发言后自动继续下一轮（辩论中成为观众质询）
                runNextTurn(meeting.id);
            };

            useEffect(() => {
                // 页面加载时拉取会议列表、人格列表，并检查 URL 中是否有要直接打开的会议
                loadMeetings();
                fetch('/api/personas').then(r => r.ok ? r.json() : []).then(setPersonas).catch(() => {});
                const params = new URLSearchParams(window.location.search);
                const mid = params.get('meeting');
                if (mid) openMeeting(mid);
            }, []);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                // 每次消息更新后高亮代码块
                if (typeof hljs !== 'undefined') {
                    hljs.highlightAll();
                }
            }, [meeting?.messages]);

            const renderMarkdown = (text) => {
                // 使用 marked 解析 Markdown，并用 DOMPurify 做 XSS 防护
                const rawHtml = typeof marked !== 'undefined'
                    ? marked.parse(text)
                    : text.replace(/\n/g, '<br>');
                const safeHtml = typeof DOMPurify !== 'undefined'
                    ? DOMPurify.sanitize(rawHtml)
                    : rawHtml;
                return { __html: safeHtml };
            };


            const isRoom = view === 'room' && meeting;

            return (
                <div className="min-h-screen flex">
                    {/* 侧边栏：会议列表 */}
                    <aside className="w-72 bg-white border-r flex flex-col shrink-0">
                        <div className="p-4 border-b">
                            <h2 className="text-lg font-bold">🤖 A2A 会议室</h2>
                            <button
                                onClick={() => { setMeeting(null); setView('list'); updateUrl(null); }}
                                className="mt-3 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium"
                            >
                                + 新建会议
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-2">
                            {meetings.length === 0 && (
                                <div className="text-gray-400 text-sm text-center py-8">暂无历史会议</div>
                            )}
                            {meetings.map(m => (
                                <div
                                    key={m.id}
                                    onClick={() => openMeeting(m.id)}
                                    className={`p-3 rounded-lg cursor-pointer border ${meeting?.id === m.id ? 'bg-blue-50 border-blue-200' : 'bg-white hover:bg-gray-50 border-gray-200'}`}
                                >
                                    <div className="font-medium text-sm truncate" title={m.topic}>{m.topic}</div>
                                    <div className="text-xs text-gray-500 mt-1 flex items-center justify-between">
                                        <span>{m.mode === 'roundtable' ? `圆桌 · ${m.max_rounds}轮` : m.mode === 'debate' ? `辩论 · ${m.max_rounds}轮` : '流水线'} · {m.created_at}</span>
                                        <button
                                            onClick={(e) => deleteMeeting(e, m.id)}
                                            className="text-gray-400 hover:text-red-500 px-1"
                                            title="删除"
                                        >×</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </aside>

                    {/* 主内容区 */}
                    <div className="flex-1 flex flex-col min-w-0 bg-gray-100">
                        {!isRoom ? (
                            <div className="flex-1 flex items-center justify-center p-6">
                                <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                                    <div className="text-4xl mb-4 text-center">🤖</div>
                                    <h1 className="text-2xl font-bold text-center mb-2">A2A 多人会议室</h1>
                                    <p className="text-gray-500 text-center mb-6">
                                        创建一个主题，邀请多个 Agent 一起讨论
                                    </p>
                                    <input
                                        type="text"
                                        value={topic}
                                        onChange={(e) => setTopic(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && createMeeting()}
                                        placeholder="输入会议主题，例如：A2A protocol"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                                    />
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">会议模式</label>
                                        <select
                                            value={mode}
                                            onChange={(e) => setMode(e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            <option value="pipeline">流水线模式（依次发言）</option>
                                            <option value="roundtable">圆桌讨论模式（Moderator 主持）</option>
                                            <option value="debate">辩论模式（人格对抗 + 裁判）</option>
                                        </select>
                                    </div>
                                    {(mode === "roundtable" || mode === "debate") && (
                                        <div className="mb-4">
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                {mode === "debate" ? "辩论轮数" : "讨论轮数"}：{maxRounds} 轮
                                            </label>
                                            <input
                                                type="range"
                                                min="1"
                                                max={mode === "debate" ? "3" : "10"}
                                                step="1"
                                                value={maxRounds}
                                                onChange={(e) => setMaxRounds(parseInt(e.target.value, 10))}
                                                className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                            />
                                            <div className="flex justify-between text-xs text-gray-400 mt-1">
                                                <span>1</span>
                                                <span>{mode === "debate" ? "3" : "10"}</span>
                                            </div>
                                        </div>
                                    )}
                                    {mode === "debate" && (
                                        <div className="mb-4 grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-2">正方人格</label>
                                                <select value={proPersona} onChange={(e) => setProPersona(e.target.value)}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                                    {personas.map(p => <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-2">反方人格</label>
                                                <select value={conPersona} onChange={(e) => setConPersona(e.target.value)}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                                    {personas.map(p => <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}
                                    <label className="flex items-center gap-2 mb-4 text-sm text-gray-700">
                                        <input type="checkbox" checked={autoPlay} onChange={(e) => setAutoPlay(e.target.checked)}
                                            className="w-4 h-4 accent-blue-600" />
                                        自动连播（默认步进，可随时插话）
                                    </label>
                                    <button
                                        onClick={createMeeting}
                                        className="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-medium"
                                    >
                                        创建会议室
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="min-h-screen flex flex-col">
                                {/* 顶部栏 */}
                                <header className="bg-white shadow-sm border-b px-6 py-4">
                                    <div className="max-w-5xl mx-auto flex items-center justify-between">
                                        <div>
                                            <h1 className="text-xl font-bold">🤖 A2A 多人会议室</h1>
                                            <p className="text-sm text-gray-500">
                                                主题：{meeting.topic}
                                                <span className="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs">
                                                    {meeting.mode === 'roundtable' ? `圆桌讨论 · ${meeting.max_rounds} 轮` : meeting.mode === 'debate' ? `辩论 · ${meeting.max_rounds} 轮${meeting.auto_play ? ' · 自动' : ' · 步进'}` : '流水线'}
                                                </span>
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-2 text-sm">
                                            <span className={`w-2 h-2 rounded-full ${connected ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                            {connected ? '实时连接中' : '已断开'}
                                        </div>
                                    </div>
                                </header>

                                {/* 参与者状态 */}
                                <div className="bg-gray-50 border-b px-6 py-3">
                                    <div className="max-w-5xl mx-auto flex gap-4">
                                        {meeting.participants.map(p => (
                                            <div key={p.id} className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg shadow-sm">
                                                <span className="text-xl">{p.avatar}</span>
                                                <div>
                                                    <div className="text-sm font-medium">{p.name}</div>
                                                    <div className="text-xs text-gray-500">
                                                        {p.status === 'thinking' && (
                                                            <span className="flex items-center gap-1">
                                                                思考中
                                                                <span className="thinking-dot w-1 h-1 bg-blue-500 rounded-full inline-block"></span>
                                                                <span className="thinking-dot w-1 h-1 bg-blue-500 rounded-full inline-block"></span>
                                                                <span className="thinking-dot w-1 h-1 bg-blue-500 rounded-full inline-block"></span>
                                                            </span>
                                                        )}
                                                        {p.status === 'speaking' && '发言中'}
                                                        {p.status === 'idle' && '等待中'}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 步进控制条 */}
                                {turnInfo && !turnInfo.done && turnInfo.next && (
                                    <div className="bg-indigo-50 border-b border-indigo-100 px-6 py-3">
                                        <div className="max-w-5xl mx-auto flex items-center gap-3 text-sm">
                                            <span className="text-indigo-700 font-medium">
                                                下一位发言：{turnInfo.next.avatar} {turnInfo.next.name}
                                            </span>
                                            <button
                                                onClick={() => runNextTurn(meeting.id)}
                                                disabled={turnRunning}
                                                className="bg-indigo-600 text-white px-4 py-1.5 rounded-lg hover:bg-indigo-700 disabled:opacity-50 font-medium"
                                            >
                                                {turnRunning ? '发言中…' : '▶ 继续'}
                                            </button>
                                            {autoPlay ? (
                                                <button onClick={() => setAutoPlay(false)}
                                                    className="ml-auto text-gray-500 hover:text-gray-700">
                                                    ⏸ 切换为步进
                                                </button>
                                            ) : (
                                                <button onClick={() => { setAutoPlay(true); runNextTurn(meeting.id); }}
                                                    className="ml-auto text-gray-500 hover:text-gray-700">
                                                    ⏩ 自动连播
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* 消息区域 */}
                                <main className="flex-1 overflow-y-auto px-6 py-6">
                                    <div className="max-w-5xl mx-auto space-y-4">
                                        {meeting.messages.map(msg => (
                                            <div
                                                key={msg.id}
                                                className={`flex ${msg.participant_id === 'user' ? 'justify-end' : 'justify-start'}`}
                                            >
                                                <div className={`max-w-3xl flex gap-3 ${msg.participant_id === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                                                    <div className="text-2xl">{msg.participant_id === 'system' ? '🔔' : meeting.participants.find(p => p.id === msg.participant_id)?.avatar || '💬'}</div>
                                                    <div className={`rounded-2xl px-5 py-3 ${
                                                        msg.participant_id === 'user'
                                                            ? 'bg-blue-600 text-white'
                                                            : msg.participant_id === 'system'
                                                                ? 'bg-yellow-100 text-yellow-800'
                                                                : msg.type === 'judge'
                                                                    ? 'bg-amber-50 border-2 border-amber-300 shadow-md'
                                                                    : 'bg-white shadow-sm border'
                                                    }`}>
                                                        <div className="text-xs opacity-75 mb-1">
                                                            {msg.participant_name} · {msg.timestamp}
                                                            {msg.type === 'judge' && (
                                                                <span className="ml-2 px-1.5 py-0.5 bg-amber-200 text-amber-800 rounded text-xs">裁判总结</span>
                                                            )}
                                                        </div>
                                                        {msg.participant_id === 'user' || msg.participant_id === 'system' ? (
                                                            <div className="whitespace-pre-wrap">{msg.content}</div>
                                                        ) : (
                                                            <div
                                                                className="markdown-body"
                                                                dangerouslySetInnerHTML={renderMarkdown(msg.content)}
                                                            />
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        <div ref={messagesEndRef} />
                                    </div>
                                </main>

                                {/* 输入框 */}
                                <footer className="bg-white border-t px-6 py-4">
                                    <div className="max-w-5xl mx-auto flex gap-3">
                                        <input
                                            type="text"
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                            placeholder="继续提问或追加需求..."
                                            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                        <button
                                            onClick={sendMessage}
                                            className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-medium"
                                        >
                                            发送
                                        </button>
                                    </div>
                                </footer>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
