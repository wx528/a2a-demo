              - paragraph [ref=f1e242]: 最终产出：
              - heading "M3 验收重跑：A2A 协议安全分析报告" [level=1] [ref=f1e243]
              - paragraph [ref=f1e244]:
                - strong [ref=f1e245]: 报告编号
                - text: ：M3-A2A-SEC-RERUN-20260509
                - strong [ref=f1e246]: 分析对象
                - text: ：Agent-to-Agent Protocol（A2A，智能体间协作协议）及典型实现
                - strong [ref=f1e247]: 分析范围
                - text: ：协议层、传输层、身份与授权、任务与消息、流式与推送通知、多跳委托、运行时与供应链
                - strong [ref=f1e248]: 重跑结论
                - text: ：
                - strong [ref=f1e249]: 交付完整性通过；安全状态有条件通过
                - text: 。A2A 提供了 agent 互操作框架与安全扩展点，但默认不保证端到端安全。若直接暴露公网、弱认证、无授权隔离、无提示注入防护，则不应上线。
              - separator [ref=f1e250]
              - heading "1. 执行摘要" [level=2] [ref=f1e251]
              - paragraph [ref=f1e252]: A2A 是面向 AI Agent 互操作的开放协议，通常基于 HTTPS、JSON-RPC 2.0、SSE 和推送通知，通过 Agent Card 暴露能力、技能、认证方案和端点。其核心价值是让不同厂商、不同框架的 agent 能发现彼此、交换任务、流式返回结果和传递产物。
              - paragraph [ref=f1e253]: 从安全角度看，A2A 的关键特征如下：
              - list [ref=f1e254]:
                - listitem [ref=f1e255]:
                  - strong [ref=f1e256]: 协议不内建统一身份信任
                  - text: ：认证与授权依赖 OpenAPI 风格安全方案，如 API Key、OAuth 2.0、OIDC、HTTP Auth、mTLS。协议合规不等于安全。
                - listitem [ref=f1e257]:
                  - strong [ref=f1e258]: Agent Card 是信任入口，但通常未强制签名
                  - text: ：伪造、篡改、过期、能力夸大都会导致上游 agent 错误信任下游 agent。
                - listitem [ref=f1e259]:
                  - strong [ref=f1e260]: 任务和消息是主要攻击载体
                  - text: ：提示注入、间接提示注入、工具滥用、数据外泄、任务重放、跨租户访问是高风险面。
                - listitem [ref=f1e261]:
                  - strong [ref=f1e262]: 多跳委托放大风险
                  - text: ：A2A 支持 agent 级联协作，若 token 透传、scope 过宽、缺少 actor 链，容易形成权限提升和混淆代理。
                - listitem [ref=f1e263]:
                  - strong [ref=f1e264]: 推送通知与 SSE 需要额外加固
                  - text: ：webhook 可成为 SSRF 入口，SSE 可被劫持或注入事件。
                - listitem [ref=f1e265]:
                  - strong [ref=f1e266]: 安全落地必须零信任
                  - text: ：每跳认证、每任务授权、最小权限、输入输出治理、沙箱、审计缺一不可。
              - paragraph [ref=f1e267]:
                - strong [ref=f1e268]: 总体建议
                - text: ：A2A 可用于生产，但必须按“零信任 + 最小权限 + 可审计”的架构部署。高优先级风险未整改前，不建议开放公网匿名访问。
              - separator [ref=f1e269]
              - heading "2. A2A 协议安全模型概述" [level=2] [ref=f1e270]
              - heading "2.1 典型组件" [level=3] [ref=f1e271]
              - table [ref=f1e273]:
                - rowgroup [ref=f1e274]:
                  - row [ref=f1e275]:
                    - columnheader "组件" [ref=f1e276]
                    - columnheader "说明" [ref=f1e277]
                    - columnheader "安全关注点" [ref=f1e278]
                - rowgroup [ref=f1e279]:
                  - row [ref=f1e280]:
                    - cell "Agent Card" [ref=f1e281]
                    - cell "描述 agent 身份、能力、技能、端点、认证方案" [ref=f1e282]
                    - cell "伪造、篡改、能力夸大、未签名" [ref=f1e283]
                  - row [ref=f1e284]:
                    - cell "A2A Client" [ref=f1e285]
                    - cell "发起任务的 agent 或客户端" [ref=f1e286]
                    - cell "凭据管理、信任决策、输入治理" [ref=f1e287]
                  - row [ref=f1e288]:
                    - cell "A2A Server" [ref=f1e289]
                    - cell "接收并执行任务的远程 agent" [ref=f1e290]
                    - cell "认证、授权、隔离、审计" [ref=f1e291]
                  - row [ref=f1e292]:
                    - cell "Task" [ref=f1e293]
                    - cell "任务生命周期对象" [ref=f1e294]
                    - cell "越权访问、重放、状态篡改" [ref=f1e295]
                  - row [ref=f1e296]:
                    - cell "Message / Part" [ref=f1e297]
                    - cell "消息与多模态内容" [ref=f1e298]
                    - cell "提示注入、恶意文件、数据泄露" [ref=f1e299]
                  - row [ref=f1e300]:
                    - cell "Artifact" [ref=f1e301]
                    - cell "任务产物" [ref=f1e302]
                    - cell "敏感数据、恶意内容、供应链" [ref=f1e303]
                  - row [ref=f1e304]:
                    - cell "SSE / Push" [ref=f1e305]
                    - cell "流式响应与 webhook 通知" [ref=f1e306]
                    - cell "劫持、注入、SSRF、重放" [ref=f1e307]
              - heading "2.2 典型流程" [level=3] [ref=f1e308]
              - list [ref=f1e309]:
                - listitem [ref=f1e310]: 客户端获取或查询远程 Agent Card。
                - listitem [ref=f1e311]: 根据 Agent Card 选择认证方式并建立 HTTPS 连接。
                - listitem [ref=f1e312]:
                  - text: 客户端调用
                  - code [ref=f1e313]: message/send
                  - text: 或
                  - code [ref=f1e314]: message/stream
                  - text: 提交任务。
                - listitem [ref=f1e315]: 远程 agent 执行任务，可能调用工具、访问数据、再调用其他 agent。
                - listitem [ref=f1e316]: 通过轮询、SSE 或推送通知返回状态、消息和 Artifact。
                - listitem [ref=f1e317]: 任务完成、失败、取消或进入需要输入的中间状态。
              - paragraph [ref=f1e318]: 安全边界出现在每一次“发现—认证—授权—执行—返回—回调”的环节。
              - separator [ref=f1e319]
              - heading "3. 资产与信任边界" [level=2] [ref=f1e320]
              - heading "3.1 关键资产" [level=3] [ref=f1e321]
              - list [ref=f1e322]:
                - listitem [ref=f1e323]: Agent 身份与凭据：API Key、OAuth token、mTLS 证书、私钥。
                - listitem [ref=f1e324]: 用户数据与业务数据：任务内容、Artifact、上下文、日志。
                - listitem [ref=f1e325]: 工具与后端系统：数据库、API、文件系统、代码执行环境、云资源。
                - listitem [ref=f1e326]: Agent Card 与注册表：能力声明、端点、认证配置。
                - listitem [ref=f1e327]: 审计与溯源数据：任务链、授权决策、工具调用记录。
              - heading "3.2 信任边界" [level=3] [ref=f1e328]
              - list [ref=f1e329]:
                - listitem [ref=f1e330]:
                  - strong [ref=f1e331]: 客户端 agent 与远程 agent 之间
                  - text: ：默认不可信，需强认证。
                - listitem [ref=f1e332]:
                  - strong [ref=f1e333]: 远程 agent 与工具/数据源之间
                  - text: ：需最小权限和沙箱。
                - listitem [ref=f1e334]:
                  - strong [ref=f1e335]: A2A 服务与推送回调接收方之间
                  - text: ：需签名、认证、出站限制。
                - listitem [ref=f1e336]:
                  - strong [ref=f1e337]: 多跳 agent 链
                  - text: ：每跳都需独立认证授权，不能继承无限信任。
                - listitem [ref=f1e338]:
                  - strong [ref=f1e339]: 租户与租户之间
                  - text: ：任务、Artifact、日志必须隔离。
              - separator [ref=f1e340]
              - heading "4. 威胁模型与攻击面" [level=2] [ref=f1e341]
              - paragraph [ref=f1e342]: 采用 STRIDE 与攻击面结合方式，主要风险如下。
              - heading "4.1 Agent Card 与发现安全" [level=3] [ref=f1e343]
              - paragraph [ref=f1e344]:
                - strong [ref=f1e345]: 风险
                - text: ：
              - list [ref=f1e346]:
                - listitem [ref=f1e347]: 攻击者伪造 Agent Card，冒充财务、运维、HR 等高权限 agent。
                - listitem [ref=f1e348]: 通过域名劫持、TLS 配置错误、DNS 污染篡改发现结果。
                - listitem [ref=f1e349]: Agent Card 声明过度能力，上游 agent 误信并发送敏感任务。
                - listitem [ref=f1e350]: 未签名 Agent Card 无法验证来源和完整性。
              - paragraph [ref=f1e351]:
                - strong [ref=f1e352]: 影响
                - text: ：身份冒充、数据泄露、任务劫持、供应链污染。
                - strong [ref=f1e353]: 等级
                - text: ：高。
                - strong [ref=f1e354]: 控制
                - text: ：HTTPS 强制、证书校验、域名允许列表、Agent Card 签名/JWS、注册表审核、能力最小声明、定期轮换。
              - heading "4.2 身份认证与授权" [level=3] [ref=f1e355]
              - paragraph [ref=f1e356]:
                - strong [ref=f1e357]: 风险
                - text: ：
              - list [ref=f1e358]:
                - listitem [ref=f1e359]: 使用弱 API Key、硬编码密钥、长期 token。
                - listitem [ref=f1e360]: OAuth scope 过宽、未校验 audience/issuer、token 透传。
                - listitem [ref=f1e361]: 多跳委托缺少 actor 链，导致混淆代理和权限提升。
                - listitem [ref=f1e362]: mTLS 配置错误，未校验客户端证书或信任链。
                - listitem [ref=f1e363]: 未认证端点暴露任务查询、取消、推送配置。
              - paragraph [ref=f1e364]:
                - strong [ref=f1e365]: 影响
                - text: ：未授权访问、横向移动、权限提升、数据泄露。
                - strong [ref=f1e366]: 等级
                - text: ：高。
                - strong [ref=f1e367]: 控制
                - text: ：OAuth 2.0/OIDC、mTLS、DPoP 或 sender-constrained token、短时 token、最小 scope、audience/issuer 校验、每跳 token exchange、每任务授权、拒绝匿名访问。
              - heading "4.3 消息、任务与提示注入" [level=3] [ref=f1e368]
              - paragraph [ref=f1e369]:
                - strong [ref=f1e370]: 风险
                - text: ：
              - list [ref=f1e371]:
                - listitem [ref=f1e372]: 直接提示注入：用户消息诱导 agent 绕过策略。
                - listitem [ref=f1e373]: 间接提示注入：Artifact、网页、文件、邮件内容污染 agent 上下文。
                - listitem [ref=f1e374]: 工具滥用：远程 agent 被诱导调用高权限工具、执行命令、访问内网。
                - listitem [ref=f1e375]: 任务重放、taskId 可预测、幂等缺失、状态机篡改。
                - listitem [ref=f1e376]: 跨租户任务访问：通过猜测 taskId 读取他人任务和 Artifact。
              - paragraph [ref=f1e377]:
                - strong [ref=f1e378]: 影响
                - text: ：数据外泄、命令执行、业务欺诈、越权操作。
                - strong [ref=f1e379]: 等级
                - text: ：高。
                - strong [ref=f1e380]: 控制
                - text: ：结构化输入、内容来源标记、提示注入检测、工具白名单、沙箱、策略引擎、人工审批高风险操作、任务 nonce、幂等键、状态机校验、任务级 ACL、不可预测 ID。
              - heading "4.4 SSE、流式与推送通知" [level=3] [ref=f1e381]
              - paragraph [ref=f1e382]:
                - strong [ref=f1e383]: 风险
                - text: ：
              - list [ref=f1e384]:
                - listitem [ref=f1e385]: SSE 连接劫持、跨域读取、事件注入。
                - listitem [ref=f1e386]: Webhook 推送伪造、重放、回调认证不足。
                - listitem [ref=f1e387]: 恶意回调 URL 触发 SSRF，访问云元数据、内网服务。
                - listitem [ref=f1e388]: 长连接耗尽资源，造成 DoS。
              - paragraph [ref=f1e389]:
                - strong [ref=f1e390]: 影响
                - text: ：数据泄露、内网探测、拒绝服务、事件伪造。
                - strong [ref=f1e391]: 等级
                - text: ：高至中。
                - strong [ref=f1e392]: 控制
                - text: ：HTTPS、Origin 校验、token 认证、webhook HMAC/JWS 签名、时间戳/nonce、重放缓存、回调 URL 允许列表、出站代理、超时与连接限制。
              - heading "4.5 数据与隐私" [level=3] [ref=f1e393]
              - paragraph [ref=f1e394]:
                - strong [ref=f1e395]: 风险
                - text: ：
              - list [ref=f1e396]:
                - listitem [ref=f1e397]: 敏感数据进入任务、Artifact、日志、模型上下文。
                - listitem [ref=f1e398]: 跨组织数据边界不清，违反数据驻留与合规要求。
                - listitem [ref=f1e399]: 日志记录 token、个人信息、业务机密。
                - listitem [ref=f1e400]: 模型记忆或缓存导致二次泄露。
              - paragraph [ref=f1e401]:
                - strong [ref=f1e402]: 影响
                - text: ：合规处罚、商业损失、隐私泄露。
                - strong [ref=f1e403]: 等级
                - text: ：高。
                - strong [ref=f1e404]: 控制
                - text: ：数据分类分级、最小化传输、加密存储与传输、脱敏、DLP、保留策略、区域化部署、审计访问。
              - heading "4.6 可用性与拒绝服务" [level=3] [ref=f1e405]
              - paragraph [ref=f1e406]:
                - strong [ref=f1e407]: 风险
                - text: ：
              - list [ref=f1e408]:
                - listitem [ref=f1e409]: 任务洪泛、大文件 Artifact、无限流式响应。
                - listitem [ref=f1e410]: 递归 agent 调用形成放大器。
                - listitem [ref=f1e411]: 资源耗尽导致合法任务不可用。
              - paragraph [ref=f1e412]:
                - strong [ref=f1e413]: 影响
                - text: ：服务中断、成本激增。
                - strong [ref=f1e414]: 等级
                - text: ：中至高。
                - strong [ref=f1e415]: 控制
                - text: ：速率限制、配额、任务大小限制、最大跳数、超时、熔断、队列、成本告警。
              - heading "4.7 供应链与实现安全" [level=3] [ref=f1e416]
              - paragraph [ref=f1e417]:
                - strong [ref=f1e418]: 风险
                - text: ：
              - list [ref=f1e419]:
                - listitem [ref=f1e420]: SDK、依赖、容器镜像漏洞。
                - listitem [ref=f1e421]: 恶意插件、工具、MCP 服务或下游 agent。
                - listitem [ref=f1e422]: 配置错误：调试端点、详细错误、默认凭据。
                - listitem [ref=f1e423]: 容器逃逸、文件系统读写过度、网络策略缺失。
              - paragraph [ref=f1e424]:
                - strong [ref=f1e425]: 影响
                - text: ：远程代码执行、数据泄露、持久化。
                - strong [ref=f1e426]: 等级
                - text: ：高。
                - strong [ref=f1e427]: 控制
                - text: ：SBOM、依赖扫描、镜像签名、最小基础镜像、只读文件系统、非 root、网络策略、密钥管理、配置基线、持续漏洞管理。
              - heading "4.8 多 Agent 协作与责任归属" [level=3] [ref=f1e428]
              - paragraph [ref=f1e429]:
                - strong [ref=f1e430]: 风险
                - text: ：
              - list [ref=f1e431]:
                - listitem [ref=f1e432]: 信任沿链传播，低权限 agent 借高权限 agent 执行操作。
                - listitem [ref=f1e433]: 错误信息级联放大，导致错误决策。
                - listitem [ref=f1e434]: 多 agent 合谋或串通绕过策略。
                - listitem [ref=f1e435]: 责任链断裂，无法审计“谁让谁做了什么”。
              - paragraph [ref=f1e436]:
                - strong [ref=f1e437]: 影响
                - text: ：系统性风险、不可追溯、合规失败。
                - strong [ref=f1e438]: 等级
                - text: ：高。
                - strong [ref=f1e439]: 控制
                - text: ：零信任、每跳认证授权、委托链 token、策略执行点、任务溯源、关联 ID、不可否认审计、最大委托深度。
              - separator [ref=f1e440]
              - heading "5. 攻击链示例" [level=2] [ref=f1e441]
              - paragraph [ref=f1e442]:
                - strong [ref=f1e443]: 场景：伪造 Agent Card + 提示注入 + Webhook SSRF
              - list [ref=f1e444]:
                - listitem [ref=f1e445]: 攻击者注册伪造的“财务审批 Agent”，Agent Card 声明高权限能力。
                - listitem [ref=f1e446]: 上游客户端未验证签名和注册表，信任该 Agent Card。
                - listitem [ref=f1e447]: 客户端发送含发票和上下文的敏感任务。
                - listitem [ref=f1e448]: 恶意 agent 通过间接提示注入诱导客户端泄露 token 或调用下游工具。
                - listitem [ref=f1e449]: 恶意 agent 设置 webhook 回调到内网地址，触发 SSRF 访问云元数据。
                - listitem [ref=f1e450]: 攻击者获取凭据并横向移动。
              - paragraph [ref=f1e451]:
                - strong [ref=f1e452]: 关键控制
                - text: ：Agent Card 签名与注册表审核、OAuth audience 校验、工具白名单、出站网络限制、webhook 签名与回调允许列表、任务级审计。
              - separator [ref=f1e453]
              - heading "6. 安全控制建议" [level=2] [ref=f1e454]
              - heading "6.1 身份与访问" [level=3] [ref=f1e455]
              - list [ref=f1e456]:
                - listitem [ref=f1e457]: 强制 HTTPS/TLS 1.2+，生产建议 mTLS。
                - listitem [ref=f1e458]: 使用 OIDC/OAuth 2.0，禁止长期静态密钥。
                - listitem [ref=f1e459]: 校验 token 的 issuer、audience、exp、scope、actor。
                - listitem [ref=f1e460]: 使用短时 token、刷新令牌轮换、DPoP 或 mTLS 绑定。
                - listitem [ref=f1e461]: 多跳委托使用 OAuth Token Exchange，保留委托链，禁止 token 透传。
                - listitem [ref=f1e462]: 每个任务执行前做一次授权决策，不依赖连接级信任。
              - heading "6.2 Agent Card 与发现" [level=3] [ref=f1e463]
              - list [ref=f1e464]:
                - listitem [ref=f1e465]: Agent Card 必须通过 HTTPS 提供，并签名或放入受信注册表。
                - listitem [ref=f1e466]: 使用域名允许列表、证书固定、注册表人工审核。
                - listitem [ref=f1e467]: 能力声明最小化，敏感技能需额外审批。
                - listitem [ref=f1e468]: 定期轮换 Agent Card 和签名密钥。
              - heading "6.3 消息与任务" [level=3] [ref=f1e469]
              - list [ref=f1e470]:
                - listitem [ref=f1e471]: 对 JSON-RPC 请求做严格 schema 校验、大小限制、速率限制。
                - listitem [ref=f1e472]: 任务 ID 使用不可预测随机值，并绑定租户和主体。
                - listitem [ref=f1e473]: 实现幂等键、nonce、时间戳，防重放。
                - listitem [ref=f1e474]: 输入输出均做内容安全过滤，标记来源，隔离不可信内容。
                - listitem [ref=f1e475]: 高风险工具调用需人工审批或多重授权。
                - listitem [ref=f1e476]: 工具白名单、参数校验、沙箱执行、禁止任意网络访问。
              - heading "6.4 流式与推送" [level=3] [ref=f1e477]
              - list [ref=f1e478]:
                - listitem [ref=f1e479]: SSE 连接认证，校验 Origin，禁止跨域滥用。
                - listitem [ref=f1e480]: Webhook 使用 HMAC/JWS 签名、时间戳、nonce，防重放。
                - listitem [ref=f1e481]: 回调 URL 允许列表，出站代理，阻断内网和云元数据地址。
                - listitem [ref=f1e482]: 设置超时、最大事件数、连接数和并发限制。
              - heading "6.5 运行时与供应链" [level=3] [ref=f1e483]
              - list [ref=f1e484]:
                - listitem [ref=f1e485]: Agent 运行在最小权限容器或沙箱中。
                - listitem [ref=f1e486]: 只读文件系统、非 root、网络策略、密钥外置。
                - listitem [ref=f1e487]: 工具和插件签名验证，SBOM 与依赖扫描。
                - listitem [ref=f1e488]: 镜像签名、准入控制、运行时威胁检测。
              - heading "6.6 可观测与治理" [level=3] [ref=f1e489]
              - list [ref=f1e490]:
                - listitem [ref=f1e491]: 记录 agent 身份、任务 ID、关联 ID、授权决策、工具调用、数据访问。
                - listitem [ref=f1e492]: 日志脱敏，禁止记录 token、密钥、完整敏感载荷。
                - listitem [ref=f1e493]: 建立异常检测、告警、审计保留和不可否认机制。
                - listitem [ref=f1e494]: 定期红队、提示注入测试、SSRF 测试、权限边界测试。
                - listitem [ref=f1e495]: 明确数据驻留、隐私、合规责任。
              - separator [ref=f1e496]
              - heading "7. M3 验收检查表" [level=2] [ref=f1e497]
              - table [ref=f1e499]:
                - rowgroup [ref=f1e500]:
