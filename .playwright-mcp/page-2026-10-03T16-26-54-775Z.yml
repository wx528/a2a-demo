              - separator [ref=f1e566]
              - heading "8. 验收结论" [level=2] [ref=f1e567]
              - paragraph [ref=f1e568]:
                - strong [ref=f1e569]: M3 验收重跑结论：有条件通过。
              - list [ref=f1e570]:
                - listitem [ref=f1e571]:
                  - strong [ref=f1e572]: 文档交付
                  - text: ：通过。本报告覆盖 A2A 协议概述、安全模型、威胁模型、攻击面、控制措施和验收检查表，可直接作为安全分析交付物。
                - listitem [ref=f1e573]:
                  - strong [ref=f1e574]: 安全上线判定
                  - text: ：有条件通过。A2A 协议本身可安全落地，但必须满足以下高优先级条件：
                  - list [ref=f1e575]:
                    - listitem [ref=f1e576]: 强制 HTTPS/mTLS 与强身份认证；
                    - listitem [ref=f1e577]: Agent Card 签名或受信注册；
                    - listitem [ref=f1e578]: 每跳、每任务授权，禁止 token 透传；
                    - listitem [ref=f1e579]: 提示注入与工具滥用防护；
                    - listitem [ref=f1e580]: Webhook/SSRF 防护与出站限制；
                    - listitem [ref=f1e581]: 任务隔离、重放防护、审计溯源；
                    - listitem [ref=f1e582]: 供应链与运行时最小权限。
              - paragraph [ref=f1e583]:
                - text: 若上述控制未落实，尤其存在匿名访问、弱认证、无任务级 ACL、无提示注入防护、无出站限制时，应判定为
                - strong [ref=f1e584]: 不通过
                - text: ，禁止生产上线。
              - paragraph [ref=f1e585]:
                - strong [ref=f1e586]: 报告结束。
